name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: Verify C++23 append_range support
        run: |
          g++-14 --version
          printf '#include <vector>\n#include <ranges>\nint main(){std::vector<int>v;std::vector<int>s{1,2};v.append_range(s);}\n' \
            | g++-14 -std=c++23 -x c++ - -o /dev/null && echo "append_range OK" || echo "append_range FAILED"

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
          $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg/installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build
        run: cmake --build build --parallel -- VERBOSE=1

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Run examples
        run: |
          mkdir -p example-output
          build/example/clock          > example-output/clock.txt
          build/example/echobox        > example-output/echobox.txt
          build/example/custom-event-list > example-output/custom-event-list.txt

      - name: Upload example output
        uses: actions/upload-artifact@v4
        with:
          name: example-output
          path: example-output/
